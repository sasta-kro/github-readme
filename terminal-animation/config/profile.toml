[profile]
username = "sasta-kro"
display_name = "SASTA-KRO"
timezone_name = "ICT"
timezone_offset_hours = 7

[shields]
style = "flat-square"
background = "05070B"
logo_color = "D4AF37"
items = [
  { label = "Go", logo = "go" },
  { label = "Python", logo = "python" },
  { label = "TypeScript", logo = "typescript" },
  { label = "React", logo = "react" },
  { label = "Docker", logo = "docker" },
  { label = "PostgreSQL", logo = "postgresql" },
  { label = "Fedora", logo = "fedora" },
  { label = "Bash", logo = "gnubash" },
]

[wordmark]
font = "ansi_shadow"
type_seconds = 3.9
hold_seconds = 5.0
cursor_blink_seconds = 0.75

[spinner]
frame_count = 48
loop_seconds = 4.0

[ticker]
messages = [
  "devops + platform engineering + backend systems",
  "fedora linux + headless servers",
  "go, python, docker, postgresql",
  "building and maintaining dependable systems",
  "building AUSE Discovery",
  "building Corvus, a self-hosted PaaS",
]
scroll_seconds = 24

[terminal]
width = 1000
height = 640
padding = 15
fps = 18

# gifos accepts 1 = fast, 2 = medium, 3 = slow.
typing_speed = 1
# Render this many visible characters in each typing frame.
typing_chars_per_frame = 2
hold_short_frames = 4
final_hold_frames = 72
rotation_frames = 36
memory_step = 16384

login_banner = "Fedora Linux (tty1)"
prompt_host = "fedora"
command = "fastfetch --config sasta-kro"
signoff = "# building dependable systems, maintaining them well, and making them better"
stack = "Go, Python, Docker, PostgreSQL"

details = [
  { label = "OS:", value = "Fedora GNOME, Fedora Server, macOS" },
  { label = "Focus:", value = "Infrastructure and backend systems" },
  { label = "Role:", value = "DevOps / Platform Engineer" },
  { label = "Shell:", value = "zsh, Bash" },
  { label = "Editor:", value = "Neovim, JetBrains IDEs" },
  { label = "Backend:", value = "Go, Python, Node, PostgreSQL" },
  { label = "Infra:", value = "Docker, Homelab, AWS, Azure" },
  { label = "Projects:", value = "AUSE Discovery, Corvus, and more" },
]

# Gold is the default. To try dark blue, swap accent and accent_soft with
# values such as #1D4ED8 and #60A5FA.
[theme.dark]
background = "#05070B"
foreground = "#F6F1E5"
muted = "#61749B"
accent = "#D4AF37"
accent_soft = "#F1D77A"
border = "#2B2515"

[theme.light]
background = "#FFFDF7"
foreground = "#17130A"
muted = "#5C6577"
accent = "#8A6508"
accent_soft = "#C59A24"
border = "#D8C995"
